project:
  type: book

# Release assignment solutions in the combined PDF as well as HTML.
show-solutions: true

book:
  title: "STAT8561 - Linear Statistical Analysis I"
  subtitle: "2026 Fall Lecture Notes"
  author: "Chi-Kuang Yeh"
  date: today

  # Keep this list aligned with the published course website.
  # Draft chapters remain in the repository until they are released.
  chapters:
    - index.qmd
    - intro.qmd
    - 01_matrix_representation.qmd
    - 02_LSE.qmd
    - 03_OLS_inference.qmd
    - 04.qmd
    - 05.qmd
    - part: "Optional topic"
      chapters:
        - App_F-quantile-regression.qmd
        - App_G-mixed-effects.qmd
    - references.qmd

    - part: "Appendix"
      chapters:
        - App_A-matrix.qmd
        - App_H-basic-mathematical-statistics.qmd

    - part: "Assignment"
      chapters:
        - Assignment1.qmd
        - Assignment2.qmd
        - Assignment3.qmd

    - part: "Project"
      chapters:
        - Project-Instructions.qmd
        - Project-Report.qmd

  navbar:
    right:
      - icon: github
        href: https://github.com/chikuang/Teaching-Stat8561
        aria-label: GitHub

      - icon: file-pdf
        href: ./STAT8561---Linear-Statistical-Analysis-I.pdf
        aria-label: Download PDF

bibliography: references.bib


execute:
  cache: true
  freeze: auto

format:
  html:
    theme:
      - pulse
      - brand
    css: custom-callouts.css
    code-fold: true
    code-summary: "Show R code"
    cache: true
    include-after-body:
      - solution-collapse.html

  pdf:
    documentclass: scrreprt
    colorlinks: true
    linkcolor: CoursePurple
    urlcolor: CoursePurple
    citecolor: CoursePurple
    toccolor: CoursePurple
    geometry:
      - margin=1in
      - headheight=38pt
      - headsep=12pt
      - footskip=36pt
    include-in-header:
      - pdf-environments.tex
      - pdf-page-style.tex
    filters:
      - filters/pdf-callouts.lua
      - filters/course-links.lua
    cache: true

editor: source
